[package]
name = "orgh-desktop"
version = "0.1.0"
description = "orgh Desktop"
edition = "2021"

[lib]
name = "orgh_desktop_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "orgh-desktop"
path = "src/main.rs"
