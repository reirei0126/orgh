[project]
name = "orgh"
version = "0.1.0"
description = "Autonomous amplifying AI-org harness: Obsidian -> plan -> Claude Code/Codex sessions -> review & improve loop"
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.scripts]
orgh = "orgh.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orgh", "orgh.adapters", "orgh.sources"]
