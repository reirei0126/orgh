  <line x1="877" y1="182" x2="890" y2="195" stroke="#4F8CFF" stroke-width="3" stroke-linecap="round"/>
  <rect x="915" y="155" width="28" height="36" rx="3" fill="none" stroke="#4F8CFF" stroke-width="3"/>
  <line x1="921" y1="166" x2="937" y2="166" stroke="#4F8CFF" stroke-width="2"/>
