<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrowGreen2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7CF29C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#0B0E14"/>

  <!-- top artifact nodes: 設計 / 実装 / 検証 -->
  <g transform="translate(280,160)">
    <rect x="-100" y="-40" width="200" height="80" rx="16" fill="#151A24" stroke="#2A3242" stroke-width="2"/>
    <rect x="-12" y="-26" width="24" height="30" rx="3" fill="none" stroke="#8891A5" stroke-width="2"/>
    <line x1="-8" y1="-16" x2="8" y2="-16" stroke="#8891A5" stroke-width="2"/>
    <line x1="-8" y1="-8" x2="8" y2="-8" stroke="#8891A5" stroke-width="2"/>
    <text x="0" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" fill="#F5F7FA">設計</text>
  </g>

  <g transform="translate(640,160)">
    <rect x="-100" y="-40" width="200" height="80" rx="16" fill="#151A24" stroke="#2A3242" stroke-width="2"/>
    <rect x="-12" y="-26" width="24" height="30" rx="3" fill="none" stroke="#8891A5" stroke-width="2"/>
    <line x1="-8" y1="-16" x2="8" y2="-16" stroke="#8891A5" stroke-width="2"/>
    <line x1="-8" y1="-8" x2="8" y2="-8" stroke="#8891A5" stroke-width="2"/>
    <text x="0" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" fill="#F5F7FA">実装</text>
  </g>

  <g transform="translate(1000,160)">
    <rect x="-100" y="-40" width="200" height="80" rx="16" fill="#151A24" stroke="#2A3242" stroke-width="2"/>
    <rect x="-12" y="-26" width="24" height="30" rx="3" fill="none" stroke="#8891A5" stroke-width="2"/>
    <line x1="-8" y1="-16" x2="8" y2="-16" stroke="#8891A5" stroke-width="2"/>
    <line x1="-8" y1="-8" x2="8" y2="-8" stroke="#8891A5" stroke-width="2"/>
    <text x="0" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" fill="#F5F7FA">検証</text>
  </g>

  <!-- convergence arrows: endpoints spread wide along the orgh box's top edge and held a few px above the border so the arrowheads stay clear of each other and of the box stroke -->
  <line x1="280" y1="200" x2="580" y2="340" stroke="#7CF29C" stroke-width="5" marker-end="url(#arrowGreen2)"/>
  <line x1="640" y1="200" x2="640" y2="340" stroke="#7CF29C" stroke-width="5" marker-end="url(#arrowGreen2)"/>
  <line x1="1000" y1="200" x2="700" y2="340" stroke="#7CF29C" stroke-width="5" marker-end="url(#arrowGreen2)"/>

  <!-- orgh aggregator node -->
  <rect x="550" y="355" width="180" height="90" rx="16" fill="#151A24" stroke="#7CF29C" stroke-width="3"/>
  <text x="640" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="#F5F7FA">orgh</text>
  <polyline points="620,406 632,418 660,392" fill="none" stroke="#7CF29C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- arrow to final artifact -->
  <line x1="640" y1="445" x2="640" y2="495" stroke="#7CF29C" stroke-width="5" marker-end="url(#arrowGreen2)"/>

  <!-- final artifact panel -->
  <rect x="480" y="500" width="320" height="120" rx="20" fill="#151A24" stroke="#2A3242" stroke-width="3"/>
  <text x="640" y="568" text-anchor="middle" font-family="system-ui, sans-serif" font-size="32" fill="#F5F7FA">成果物</text>
</svg>
