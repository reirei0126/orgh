<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrowBlue3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4F8CFF"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#0B0E14"/>

  <!-- orchestrator parent node -->
  <rect x="470" y="80" width="340" height="80" rx="16" fill="#151A24" stroke="#4F8CFF" stroke-width="3"/>
  <text x="640" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" fill="#F5F7FA">オーケストレーター</text>

  <!-- fan-out arrows -->
  <line x1="640" y1="160" x2="280" y2="505" stroke="#4F8CFF" stroke-width="5" marker-end="url(#arrowBlue3)"/>
  <line x1="640" y1="160" x2="640" y2="505" stroke="#4F8CFF" stroke-width="5" marker-end="url(#arrowBlue3)"/>
  <line x1="640" y1="160" x2="1000" y2="505" stroke="#4F8CFF" stroke-width="5" marker-end="url(#arrowBlue3)"/>

  <!-- child node: 設計 -->
  <g transform="translate(280,560)">
    <rect x="-110" y="-45" width="220" height="90" rx="16" fill="#151A24" stroke="#4F8CFF" stroke-width="3"/>
    <rect x="-30" y="-26" width="60" height="14" rx="2" fill="none" stroke="#4F8CFF" stroke-width="2"/>
    <line x1="-15" y1="-26" x2="-15" y2="-16" stroke="#4F8CFF" stroke-width="2"/>
    <line x1="0" y1="-26" x2="0" y2="-16" stroke="#4F8CFF" stroke-width="2"/>
    <line x1="15" y1="-26" x2="15" y2="-16" stroke="#4F8CFF" stroke-width="2"/>
    <text x="0" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="#F5F7FA">設計</text>
  </g>

  <!-- child node: 実装 -->
  <g transform="translate(640,560)">
    <rect x="-110" y="-45" width="220" height="90" rx="16" fill="#151A24" stroke="#4F8CFF" stroke-width="3"/>
    <text x="0" y="-8" text-anchor="middle" font-family="monospace, system-ui, sans-serif" font-size="32" fill="#4F8CFF">{ }</text>
    <text x="0" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="#F5F7FA">実装</text>
  </g>

  <!-- child node: 検証 -->
  <g transform="translate(1000,560)">
    <rect x="-110" y="-45" width="220" height="90" rx="16" fill="#151A24" stroke="#4F8CFF" stroke-width="3"/>
    <polyline points="-16,-16 -4,-4 18,-30" fill="none" stroke="#4F8CFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="#F5F7FA">検証</text>
  </g>

  <!-- parallel execution dashed connectors -->
  <line x1="390" y1="560" x2="530" y2="560" stroke="#8891A5" stroke-width="2" stroke-dasharray="8,6"/>
  <line x1="750" y1="560" x2="890" y2="560" stroke="#8891A5" stroke-width="2" stroke-dasharray="8,6"/>
</svg>
