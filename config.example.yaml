runs_dir: runs
prompts_dir: prompts         # 役割プロンプト(planner/reviewer/retro/worker_preamble)の置き場
playbooks_dir: playbooks     # Retroが蒸留した組織知の置き場

criteria_dir: criteria       # オーナー判断基準台帳。Reviewer/ペルソナ検収に注入され、
criteria_max_inject_chars: 4000     # 台帳注入の上限字数。超過分は日付降順で古い方から注入対象外(既定4000)
                             # orgh verdict の裁定から下書きが自動生成される
                             # (本台帳への反映は orgh criteria approve のみ)

personas:                    # ペルソナ検収ゲート(戦略設計書 柱1)
  enabled: []                # 例: [consumer, designer]。空なら完全無効(従来動作)
  apply: final_task          # 依存されない最終タスクに適用(現状これのみ)
  # 注: 実行開始済みミッションはタスクにpersonas割り当てが保存済みのため、
  # enabledを空に戻してもresume時はゲートが走る(ミッション単位の一貫性)

# roles にペルソナ・蒸留ロールを追加できる(未指定時のデフォルトは以下と同値)
#   persona_consumer: {model: sonnet, max_turns: 30, allowed_tools: "Read,Bash,Glob,Grep"}
#   persona_designer: {model: sonnet, max_turns: 30, allowed_tools: "Read,Bash,Glob,Grep"}
#   criteria_distill: {model: sonnet, max_turns: 5, allowed_tools: "Read"}
# projects_map: ~/obsidian/main/orgh/projects-map.md
#                              # 対象プロジェクトの「絶対パス ⇔ 説明(通称含む)」対応表。
#                              # Plannerのworkdir解決に注入される。曖昧なノート
#                              # (パス未記載)でも正しいリポで実行させるために使う

workers:
  enabled: [claude_code, codex]
  # 全workerに共通: 秘密パターン(KEY/TOKEN/SECRET/PASSWORD等)の環境変数は
  # workerへ継承させない(prompt注入されたworkerによる漏洩防止)。ANTHROPIC_API_KEY等
  # の代表的な認証変数は既定で通す。stripされて困る独自変数のみ env_secret_allow で通す。
  claude_code:
    bin: claude
    model: sonnet              # 実働はSonnet。三層フレームワークに合わせて変更可
    max_turns: 60
    allowed_tools: "Read,Write,Edit,Glob,Grep"   # Bashはデフォルト付与しない。必要なタスクにはPlannerがtoolsで明示付与
    permission_mode: acceptEdits
    # env_secret_allow: [MY_CUSTOM_TOKEN]   # 秘密パターンでもworkerへ通したい変数
    # capability_allowlist: 固定Bashパターンの能力宣言(A2限定版, 方向性文書2026-08
    #   §3.1)。既定は未設定(空=無効)。設定した場合のみ、その内容が起動時の
    #   --allowedTools へ「追記」注入される(未設定なら従来の引数列と1バイトも
    #   変わらない)。注入した内容はミッションledgerに task.capability_allowlist
    #   として記録され、後から「そのタスクに何が許可されていたか」を追跡できる。
    #   ⚠ これはセキュリティ境界ではない/セキュリティ保証ではない: 同じargvでも
    #   PATH差し替え・cwd・設定ファイル・git hook・symlink・環境変数によって
    #   実際の書き込み/外部通信は変わりうる(sandbox/egress制御は無い)。ここでの
    #   許可は「能力不足を誤ってawaiting_human(人間依頼)へ変換しない」ための
    #   能力宣言というUX改善であって、実行環境そのものを隔離する保証ではない。
    #   以下は b6503b9a t3(読み取り専用gitの承認待ちで人間依頼化した実害)で
    #   実証された値。claude CLIのallowedToolsパターン仕様(Bash(<prefix>)形式)を
    #   そのまま踏襲しており調整はしていない
    # capability_allowlist:
    #   - "Bash(git -C * rev-parse *)"
    #   - "Bash(git -C * status *)"
    #   - "Bash(git -C * log *)"
    #   - "Bash(git -C * show *)"
    #   - "Bash(git -C * diff *)"
  codex:
    bin: codex
    extra_args: ["--sandbox", "workspace-write", "--skip-git-repo-check"]  # codex 0.146+。--full-autoは非推奨、git外workdirには--skip-git-repo-check必須
  shell:                           # 他LLM CLI用の汎用枠 (例: gemini)
    argv: ["gemini", "-p", "{prompt}"]

roles:                         # 経営層・ゲート層のモデル割り当て
  planner:
    model: opus                # 設計判断はOpus (or fable)
    max_turns: 40              # 計画前の探索(Read/Glob)分を含む。10だと走査系ミッションで上限死する
    allowed_tools: "Read,Glob,Grep"
  reviewer:
    model: sonnet
    max_turns: 30              # ビルド・テスト再実行を伴うレビューがあるため余裕を持たせる(15だと上限死する)
    allowed_tools: "Read,Bash,Glob,Grep"   # 実ファイル・テストを検証させる
  retro:
    model: sonnet
    max_turns: 5
    allowed_tools: "Read"

loop:
  parallel: 3                  # 同時セッション数
  max_attempts: 3              # 実行+差し戻しの上限
  task_timeout: 3600
  budget_usd: null             # ルートミッション全体のコスト上限USD(null=無制限)
  task_budget_usd: null        # 1タスクあたりの上限USD(null=無制限)
  global_parallel: null        # 全orghプロセス横断のworker同時数上限(null=無効)。
                               # parallelは1ミッション内の枠、こちらはwatch/CLI/GUIを
                               # またいだ総枠(runs/_slots/のflockセマフォで強制)
  global_role_parallel: null   # 同、ロール(planner/reviewer等)の別枠(null=無効)

worktree:                      # タスクごとのgit worktree分離(並列タスクの同一リポ衝突を回避)
  enabled: false               # デフォルト無効(後方互換)
  base_ref: HEAD               # 分岐元
  root: .orgh-worktrees        # worktree置き場(taskのworkdir相対)

copyback:                      # 非git成果物領域への書き戻し許可(方向性文書2026-08 §4 3a')
  allowed_roots: []            # 絶対パスのみ許可。既定は空リスト=copyback無効。
                                # 例: ["/Users/you/projects/decision-os-mvp/private/cases"]
                                # ⚠ コピー時の宛先事前hash突合による競合検知(copyback_conflict)は
                                # 暫定運用でありセキュリティ保証ではない(sandbox/filesystem強制が
                                # 無いため、同じhashでの同時書き込み等までは検知できない)

watch:                         # orgh watch (イベント駆動デーモン)
  interval: 5                  # 監視間隔(秒)
  stabilize_seconds: 20        # 書きかけノートを拾わない猶予
  writeback: true              # 着火直後にノート末尾へ結果ノートへのリンクを1行追記
  gc_interval_days: 14         # この日数ごとにwatcherが自動でorgh gc相当を実行(null=無効)
  queue_limit: 20              # runs/_queue/ の有界上限(満杯時は着火見送り・次パス再試行)
  parallel_missions: 1         # executorの同時ミッション消化数(既定1=旧watchと
                               # 同じ直列実行。並列消化はopt-in)。orgh watch は既定で
                               # executorを同プロセス併走する。完全分離は
                               # orgh watch --watch-only + orgh executor

gc:                            # orgh gc(playbookの代謝とruns保持)
  retention_days: 90           # これより古いミッションは runs/_archive/ へ退避

notify:                        # 人間接点イベント通知(A1out)。既定は無効(挙動不変)
  webhook_url: null            # POST先URL。null=webhook無効(ledgerのnotify.emittedのみ記録)
  timeout: 5                   # POSTのタイムアウト秒


# --- 以下は Obsidian をメモ起点に使う場合だけ設定する(任意) ---
# 未設定でも orgh run --intent / doctor / resume は問題なく動く。
# scan / watch / run --note を使うときだけ必要。

vault:
  path: ~/obsidian/main        # Obsidian vaultのパス
  inbox: inbox                 # このフォルダ配下のノートはミッション候補
  mission_tag: mission         # 候補として認識(scan用)。着火はtrigger_tag
  trigger_tag: go              # 明示着火タグ。inbox配置だけでは着火しない。
                                # ノート本文の #go インラインタグ、または
                                # frontmatterの `orgh: go` で着火する

source:                        # 入力ソースの選択(将来Notion等を差し替え可能にする拡張点)
  type: obsidian               # 現状は obsidian のみ
